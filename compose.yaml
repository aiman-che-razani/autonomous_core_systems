services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: greyqueue
      POSTGRES_DB: greyqueue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greyqueue -d greyqueue"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://greyqueue:${POSTGRES_PASSWORD}@postgres:5432/greyqueue
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  coordinator:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://greyqueue:${POSTGRES_PASSWORD}@postgres:5432/greyqueue
    ports: ["127.0.0.1:8810:8810"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8810/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    build: .
    env_file: .env
    environment:
      COORDINATOR_URL: http://coordinator:8810
    command: ["greyqueue-worker"]
    depends_on:
      coordinator:
        condition: service_healthy
volumes:
  postgres_data:
