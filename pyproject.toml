[project]
name = "greyqueue"
version = "1.0.0"
description = "A PostgreSQL-backed distributed job engine learning platform"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.121,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "psutil>=6,<8", "matplotlib>=3.9,<4", "playwright>=1.50,<2"]

[project.scripts]
greyqueue = "greyqueue.cli:main"
greyqueue-worker = "greyqueue.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL database"]
