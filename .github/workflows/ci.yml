name: checks
on: [push, pull_request, workflow_dispatch]
# A newer push to the same ref supersedes the older run.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    # A branch of this repository is already tested by its push; its pull_request run would
    # repeat the same commit. Pull requests from forks still run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30  # a hung Playwright or Compose step must not hold a runner for 6 h
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: greyqueue
          POSTGRES_DB: greyqueue
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greyqueue -d greyqueue"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://greyqueue:ci-only-password@127.0.0.1:5432/greyqueue
      TEST_DATABASE_URL: postgresql+psycopg://greyqueue:ci-only-password@127.0.0.1:5432/greyqueue
      CLIENT_TOKEN: ci-only-client-token
      WORKER_TOKEN: ci-only-worker-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # setup-uv downloads uv and verifies its checksum (unlike an unhashed pip install).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.15'
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      # A missing TEST_DATABASE_URL would skip every database test and still pass, so any
      # skip fails the job.
      - run: uv run pytest -q -rs | tee pytest.log
      - run: "! grep -Eq '^SKIPPED|[0-9]+ skipped' pytest.log"
      - run: uv run python -m scripts.experiments
      - run: uv run python -m scripts.side_effects
      - run: uv run python -m scripts.profile_reads
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m scripts.check_dashboard
      # Full Compose stack: migrate, least-privilege db-roles, coordinator, three workers.
      # configure.py writes .env (POSTGRES/APP_DB passwords); job-level env supplies tokens.
      - run: python scripts/configure.py
      - run: docker compose -p greyqueue-ci up -d --build --wait --wait-timeout 180
      - run: uv run python -m scripts.check_compose
      # The least-privilege role must read and write rows but nothing more (ADR 008).
      - run: bash scripts/check_roles.sh greyqueue-ci
      - if: always()
        run: docker compose -p greyqueue-ci logs --no-color > docs/results/compose-ci.log 2>&1 || true
      - if: always()
        # Without .env (a failure before configure.py) interpolation fails and nothing is up.
        run: "[ ! -f .env ] || docker compose -p greyqueue-ci down -v"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: validation-evidence
          path: docs/results/
