name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: greyqueue
          POSTGRES_DB: greyqueue
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greyqueue -d greyqueue"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://greyqueue:ci-only-password@127.0.0.1:5432/greyqueue
      TEST_DATABASE_URL: postgresql+psycopg://greyqueue:ci-only-password@127.0.0.1:5432/greyqueue
      CLIENT_TOKEN: ci-only-client-token
      WORKER_TOKEN: ci-only-worker-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.15
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run python -m scripts.experiments
      - run: uv run python -m scripts.side_effects
      - run: uv run python -m scripts.profile_reads
      - run: uv run playwright install --with-deps chromium
      - run: uv run python -m scripts.check_dashboard
      - run: docker build -t greyqueue:ci .
      # Full Compose stack: migrate, least-privilege db-roles, coordinator, three workers.
      # configure.py writes .env (POSTGRES/APP_DB passwords); job-level env supplies tokens.
      - run: python scripts/configure.py
      - run: docker compose -p greyqueue-ci up -d --build --scale worker=3 --wait --wait-timeout 180
      - run: uv run python -m scripts.check_compose
      - if: always()
        run: docker compose -p greyqueue-ci logs --no-color > docs/results/compose-ci.log 2>&1 || true
      - if: always()
        run: docker compose -p greyqueue-ci down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-evidence
          path: docs/results/
