name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_USER: greyqueue
          POSTGRES_DB: greyqueue
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greyqueue -d greyqueue"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://greyqueue:ci-only-password@127.0.0.1:5432/greyqueue
      TEST_DATABASE_URL: postgresql+psycopg://greyqueue:ci-only-password@127.0.0.1:5432/greyqueue
      CLIENT_TOKEN: ci-only-client-token
      WORKER_TOKEN: ci-only-worker-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.15
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run python scripts/demo.py
